<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>樂團排歌單</title>
<style>
  :root {
    --bg: #111214;
    --panel: #1a1c20;
    --card: #24272d;
    --card-hover: #2c3037;
    --line: #33373e;
    --text: #eceef1;
    --muted: #9097a1;
    --accent: #f5b83d;
    --ok: #4cc38a;
    --warn: #f07a5a;
    --danger: #e5484d;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.4;
  }
  header {
    padding: 20px 16px 12px;
    max-width: 1280px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
  }
  h1 { font-size: 22px; margin: 0; letter-spacing: .02em; }
  h1 small { display: block; font-size: 13px; color: var(--muted); font-weight: 400; margin-top: 4px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font: inherit;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
  }
  button:hover { background: var(--card-hover); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #1a1406; border-color: var(--accent); font-weight: 600; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }

  .status {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 16px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 13px;
  }
  .pill { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .pill.bad { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .pill.sync::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; }

  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 16px 40px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }
  .col {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    min-width: 0;
  }
  .col h2 {
    font-size: 17px;
    margin: 0 0 10px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .count { font-size: 13px; font-weight: 400; color: var(--muted); }
  .count.ok { color: var(--ok); }
  .count.bad { color: var(--warn); }
  .label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .08em;
    margin: 12px 0 6px;
  }
  .label:first-of-type { margin-top: 0; }
  .encore-label { margin-top: 18px; padding-top: 12px; border-top: 1px dashed var(--line); display: flex; justify-content: space-between; }
  .encore-label .count { text-transform: none; letter-spacing: 0; }
  .list.encore .card { border-color: color-mix(in srgb, var(--ok) 50%, transparent); background: color-mix(in srgb, var(--ok) 8%, var(--card)); }
  .encore .num { color: var(--ok); font-weight: 700; }

  .add-btn {
    width: 100%;
    margin-bottom: 10px;
    border-style: dashed;
    background: transparent;
    color: var(--muted);
  }
  .add-btn:hover { color: var(--text); border-color: var(--muted); }

  .list { min-height: 56px; display: flex; flex-direction: column; gap: 6px; border-radius: var(--radius); }
  .list:empty::after {
    content: attr(data-empty);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 56px;
    border: 1.5px dashed var(--line);
    border-radius: var(--radius);
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 8px;
  }
  .list.opener { min-height: 60px; }
  .list.opener .card { border-color: color-mix(in srgb, var(--accent) 60%, transparent); background: color-mix(in srgb, var(--accent) 10%, var(--card)); }

  .card {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 4px solid var(--artist, var(--line));
    border-radius: var(--radius);
    padding: 9px 10px;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .card:hover { background: var(--card-hover); }
  .card.flash { animation: flash 1.6s ease-out; }
  @keyframes flash {
    0%, 30% { background: color-mix(in srgb, var(--accent) 35%, var(--card)); }
    100% { background: var(--card); }
  }
  .num {
    flex: 0 0 auto;
    width: 26px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-size: 13px;
  }
  .opener .num { color: var(--accent); font-weight: 700; width: auto; }
  .pool .num { display: none; }
  .meta { flex: 1 1 auto; min-width: 0; }
  .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .artist { font-size: 12px; color: var(--muted); }
  .tag {
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 18%, transparent);
    color: var(--accent);
    margin-left: 6px;
    vertical-align: 1px;
    font-weight: 500;
  }
  .more {
    flex: 0 0 auto;
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 4px 8px;
    font-size: 18px;
    line-height: 1;
  }
  .more:hover { color: var(--text); background: var(--line); }

  .sortable-ghost { opacity: .35; }
  .sortable-chosen { box-shadow: 0 6px 20px rgba(0,0,0,.45); }
  .sortable-drag { cursor: grabbing; }

  .menu {
    position: fixed;
    z-index: 20;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    display: flex;
    flex-direction: column;
    min-width: 170px;
  }
  .menu button { border: none; background: transparent; text-align: left; padding: 8px 10px; }
  .menu button:hover { background: var(--card); }
  .menu hr { border: none; border-top: 1px solid var(--line); margin: 6px 4px; }
  .menu button.menu-del { color: var(--muted); font-size: 13px; }
  .menu button.menu-del:hover { color: var(--danger); }

  dialog {
    width: min(480px, calc(100vw - 32px));
    max-height: calc(100vh - 32px);
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
  }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h3 { margin: 0 0 12px; font-size: 17px; }
  dialog p { margin: 0 0 10px; }
  .muted { color: var(--muted); font-size: 13px; }
  .field { display: block; margin-bottom: 10px; }
  .field span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input[type=text] {
    width: 100%;
    font: inherit;
    font-size: 16px; /* 避免 iOS 自動放大 */
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 10px;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .results { display: flex; flex-direction: column; gap: 4px; margin: 8px 0 14px; min-height: 20px; }
  .results button {
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    padding: 6px 8px;
    background: transparent;
    border-color: transparent;
  }
  .results button:hover, .results button.sel { background: var(--card); border-color: var(--line); }
  .results button.sel { border-color: var(--accent); }
  .results img { width: 36px; height: 36px; border-radius: 4px; flex: 0 0 auto; background: var(--card); }
  .results .r-title { font-weight: 600; }
  .results .r-artist { font-size: 12px; color: var(--muted); }
  .results .manual { color: var(--muted); font-size: 13px; }
  .picked { border-top: 1px solid var(--line); padding-top: 14px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .msg { min-height: 18px; font-size: 13px; color: var(--warn); margin-bottom: 8px; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: var(--bg);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 30;
    max-width: calc(100vw - 32px);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .toast button { background: transparent; border: none; color: #b5700a; font-weight: 700; padding: 0; }

  .hint { max-width: 1280px; margin: 0 auto; padding: 0 16px 24px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<header>
  <h1>樂團排歌單<small>把卡片拖進上下半場；每個半場 1 首開場＋8–10 首，最後安可 1–2 首</small></h1>
  <div class="actions">
    <button class="primary" id="btn-share">複製網址</button>
    <button id="btn-text">複製歌單文字</button>
    <button id="btn-reset">全部放回歌曲庫</button>
  </div>
</header>

<div class="status" id="status"></div>

<main>
  <section class="col">
    <h2>歌曲庫 <span class="count" id="count-pool"></span></h2>
    <button class="add-btn" id="btn-add" type="button">＋ 新增歌曲</button>
    <div class="list pool" id="pool" data-empty="全部歌都排進去了"></div>
  </section>

  <section class="col">
    <h2>上半場 <span class="count" id="count-1"></span></h2>
    <div class="label">開場曲</div>
    <div class="list opener" id="o1" data-empty="拖一首歌到這裡當開場"></div>
    <div class="label">曲目（8–10 首）</div>
    <div class="list set" id="s1" data-empty="把歌拖進來"></div>
  </section>

  <section class="col">
    <h2>下半場 <span class="count" id="count-2"></span></h2>
    <div class="label">開場曲</div>
    <div class="list opener" id="o2" data-empty="拖一首歌到這裡當開場"></div>
    <div class="label">曲目（8–10 首）</div>
    <div class="list set" id="s2" data-empty="把歌拖進來"></div>
    <div class="label encore-label">安可（1–2 首） <span class="count" id="count-e"></span></div>
    <div class="list encore" id="e" data-empty="把安可曲拖進來"></div>
  </section>
</main>

<p class="hint">大家共用同一份歌單：有人拖曳、新增或刪除，其他開著這一頁的人會馬上看到，不用再傳連結。手機上長按卡片再拖曳，或點 ⋯ 直接選要放哪裡。</p>

<dialog id="add-dialog">
  <h3>新增歌曲</h3>
  <label class="field">
    <span>輸入大概的歌名（可以加歌手，例如「wonderwall oasis」）</span>
    <input type="text" id="add-q" autocomplete="off" placeholder="歌名…">
  </label>
  <div class="results" id="add-results"></div>
  <div class="picked">
    <div class="row2">
      <label class="field"><span>歌名</span><input type="text" id="add-title" autocomplete="off"></label>
      <label class="field"><span>歌手</span><input type="text" id="add-artist" autocomplete="off"></label>
    </div>
    <label class="field"><span>標籤（選填，例如客串的人）</span><input type="text" id="add-tag" maxlength="12" autocomplete="off"></label>
    <div class="msg" id="add-msg"></div>
    <div class="dlg-actions">
      <button type="button" id="add-cancel">取消</button>
      <button type="button" class="primary" id="add-ok" disabled>加入歌曲庫</button>
    </div>
  </div>
</dialog>

<dialog id="tag-dialog">
  <h3>標籤</h3>
  <p class="muted">「<b id="tag-name"></b>」的標籤，例如客串的人或備註（最多 12 個字）</p>
  <label class="field"><input type="text" id="tag-input" maxlength="12" autocomplete="off" placeholder="例如：小任"></label>
  <div class="dlg-actions">
    <button type="button" id="tag-clear" style="margin-right:auto">拿掉標籤</button>
    <button type="button" id="tag-cancel">取消</button>
    <button type="button" class="primary" id="tag-ok">儲存</button>
  </div>
</dialog>

<dialog id="del-dialog">
  <h3>刪除歌曲</h3>
  <p>確定要把「<b id="del-name"></b>」從歌曲庫刪掉嗎？</p>
  <p class="muted">刪掉之後，所有團員的歌曲庫都會少這首歌。</p>
  <div class="dlg-actions">
    <button type="button" id="del-cancel" autofocus>取消</button>
    <button type="button" class="danger" id="del-ok">刪除</button>
  </div>
</dialog>

<div class="toast" id="toast"><span id="toast-msg"></span><button type="button" id="toast-act" hidden></button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
// ===== 共用歌單存在 Firebase Realtime Database 的 /setlist =====
const FIREBASE = {
  databaseURL: "https://band-setlist-11b7c-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "band-setlist-11b7c",
};

// ===== 內建歌曲清單：id 不要重複、不要改舊的 id（網頁上新增的歌會存在資料庫裡，不用改這裡）=====
const BASE_SONGS = [
  { id: 1,  title: "I'll Stick Around",         artist: "Foo Fighters" },
  { id: 2,  title: "All My Life",               artist: "Foo Fighters" },
  { id: 3,  title: "Monkey Wrench",             artist: "Foo Fighters" },
  { id: 4,  title: "Stacked Actors",            artist: "Foo Fighters" },
  { id: 5,  title: "Breakout",                  artist: "Foo Fighters" },
  { id: 6,  title: "My Hero",                   artist: "Foo Fighters" },
  { id: 7,  title: "Learn to Fly",              artist: "Foo Fighters" },
  { id: 8,  title: "Everlong",                  artist: "Foo Fighters" },
  { id: 9,  title: "Times Like These",          artist: "Foo Fighters" },
  { id: 10, title: "Hey, Johnny Park!",         artist: "Foo Fighters" },
  { id: 11, title: "Smells Like Teen Spirit",   artist: "Nirvana", tag: "小任" },
  { id: 12, title: "Heart-Shaped Box",          artist: "Nirvana" },
  { id: 13, title: "Lithium",                   artist: "Nirvana" },
  { id: 14, title: "Breed",                     artist: "Nirvana" },
  { id: 15, title: "Special K",                 artist: "Placebo" },
  { id: 16, title: "The Kids Aren't Alright",   artist: "The Offspring" },
  { id: 17, title: "Californication",           artist: "Red Hot Chili Peppers" },
  { id: 18, title: "Don't Look Back in Anger",  artist: "Oasis" },
  { id: 19, title: "重回往日時光",               artist: "",  tag: "金剛" },
  { id: 20, title: "Killing in the Name",       artist: "Rage Against the Machine", tag: "小痞" },
];
const CUSTOM_ID_START = 1000;   // 網頁上新增的歌從 1000 號開始
const SET_MIN = 8, SET_MAX = 10;
const ENCORE_MIN = 1, ENCORE_MAX = 2;

const ARTIST_COLORS = {
  "Foo Fighters": "#e0524f",
  "Nirvana": "#5b9cf0",
  "Placebo": "#b07cf0",
  "The Offspring": "#f09a3e",
  "Red Hot Chili Peppers": "#e0609c",
  "Oasis": "#4cc3b6",
  "Rage Against the Machine": "#d6c64a",
};
function artistColor(artist) {
  if (!artist) return "var(--line)";
  if (ARTIST_COLORS[artist]) return ARTIST_COLORS[artist];
  let h = 0;
  for (const ch of artist) h = (h * 31 + ch.codePointAt(0)) % 360;
  return `hsl(${h} 65% 62%)`;
}

const $ = id => document.getElementById(id);
const LISTS = ["pool", "o1", "s1", "o2", "s2", "e"];
const SET_KEYS = ["o1", "s1", "o2", "s2", "e"];   // 會編進存檔字串的清單
const STORE_KEY = "band-setlist-v1";

// ---------- state ----------
// state = { pool, o1, s1, o2, s2, custom: [{id,title,artist,tag}], deleted: [內建歌 id],
//           tags: {內建歌 id: 網頁上改過的標籤（"" = 拿掉）} }
let state;
const TAG_MAX = 12;

function catalog(st = state) {
  const del = new Set(st.deleted);
  return [...BASE_SONGS.filter(s => !del.has(s.id)), ...st.custom];
}
function song(id) {
  const base = BASE_SONGS.find(s => s.id === id);
  if (base) return id in state.tags ? { ...base, tag: state.tags[id] } : base;
  return state.custom.find(s => s.id === id);
}

// 修正狀態：去重、丟掉不存在的歌、沒出現的歌放回歌曲庫、開場最多 1 首
function normalize(raw) {
  const custom = [], cids = new Set();
  for (const c of raw.custom || []) {
    if (!c || !Number.isInteger(c.id) || c.id < CUSTOM_ID_START || cids.has(c.id)) continue;
    if (typeof c.title !== "string" || !c.title.trim()) continue;
    cids.add(c.id);
    custom.push({
      id: c.id,
      title: c.title.trim(),
      artist: typeof c.artist === "string" ? c.artist.trim() : "",
      tag: typeof c.tag === "string" ? c.tag.trim() : "",
    });
  }
  const deleted = [...new Set((raw.deleted || []).filter(id => BASE_SONGS.some(s => s.id === id)))];
  // 內建歌的標籤只記「跟原本不一樣」的
  const tags = {};
  for (const [k, v] of Object.entries(raw.tags || {})) {
    const base = BASE_SONGS.find(s => s.id === Number(k));
    if (!base || typeof v !== "string") continue;
    const t = v.trim().slice(0, TAG_MAX);
    if (t !== (base.tag || "")) tags[base.id] = t;
  }
  const st = { pool: [], o1: [], s1: [], o2: [], s2: [], e: [], custom, deleted, tags };
  const valid = new Set(catalog(st).map(s => s.id));
  const seen = new Set();
  for (const k of [...SET_KEYS, "pool"]) {
    for (const id of raw[k] || []) {
      if (valid.has(id) && !seen.has(id)) { seen.add(id); st[k].push(id); }
    }
  }
  for (const k of ["o1", "o2"]) {
    while (st[k].length > 1) st.pool.push(st[k].pop());
  }
  for (const s of catalog(st)) if (!seen.has(s.id)) st.pool.push(s.id);
  return st;
}

function emptyState() {
  return normalize({});
}

function encode(st) {
  const p = new URLSearchParams();
  for (const k of SET_KEYS) if (st[k].length) p.set(k, st[k].join("."));
  if (st.custom.length) {
    p.set("c", JSON.stringify(st.custom.map(c =>
      c.tag ? [c.id, c.title, c.artist, c.tag] : [c.id, c.title, c.artist])));
  }
  if (st.deleted.length) p.set("d", st.deleted.join("."));
  if (Object.keys(st.tags).length) p.set("g", JSON.stringify(st.tags));
  return p.toString();
}

function decode(str) {
  const p = new URLSearchParams(str);
  if (![...SET_KEYS, "c", "d", "g"].some(k => p.has(k))) return null;
  const nums = v => v ? v.split(".").map(Number).filter(Number.isInteger) : [];
  const raw = { deleted: nums(p.get("d")), custom: [] };
  for (const k of SET_KEYS) raw[k] = nums(p.get(k));
  try {
    const arr = JSON.parse(p.get("c") || "[]");
    if (Array.isArray(arr)) {
      raw.custom = arr.filter(Array.isArray).map(([id, title, artist, tag]) => ({ id, title, artist, tag }));
    }
  } catch (e) {}
  try {
    const g = JSON.parse(p.get("g") || "{}");
    if (g && typeof g === "object" && !Array.isArray(g)) raw.tags = g;
  } catch (e) {}
  return raw;
}

// 舊版分享連結把歌單編在網址 # 後面；現在只在第一次同步時拿來問要不要套用
const legacy = decode(location.hash.slice(1));

function load() {
  if (legacy) return normalize(legacy);
  try {
    const saved = localStorage.getItem(STORE_KEY);
    if (saved) { const r = decode(saved); if (r) return normalize(r); }
  } catch (e) {}
  return emptyState();
}

state = load();

// 本機只留一份備份，連線前先有畫面可看；真正的歌單以資料庫為準
function save() {
  try { localStorage.setItem(STORE_KEY, encode(state)); } catch (e) {}
}

function update(next) {
  state = normalize(next);
  save();
  render();
  push();
}

// ---------- 即時同步 ----------
const CLIENT = Math.random().toString(36).slice(2, 10);
let ref = null, synced = false, remoteQ = null, syncState = "wait";
let dragging = false, pendingRemote = null;

function setSync(s) { syncState = s; renderStatus(); }

// 第一次同步完成前不寫入，避免用本機舊資料蓋掉大家的歌單
function push() {
  if (!ref || !synced) return;
  const q = encode(state);
  if (q === remoteQ) return;
  remoteQ = q;
  ref.set({ q, t: firebase.database.ServerValue.TIMESTAMP, by: CLIENT })
    .catch(() => toast("存不上去，請重新整理再試一次"));
}

function applyRemote(q) {
  const next = normalize(decode(q) || {});
  if (dragging) { pendingRemote = next; return; }   // 拖到一半先不重畫，放手時再合併
  if (encode(next) === encode(state)) return;
  state = next;
  save();
  closeMenu();
  render();
}

function startSync() {
  try {
    firebase.initializeApp(FIREBASE);
    const db = firebase.database();
    ref = db.ref("setlist");
    db.ref(".info/connected").on("value", s => {
      if (synced) setSync(s.val() ? "ok" : "off");
    });
    ref.on("value", snap => {
      const v = snap.val();
      const first = !synced;
      synced = true;
      setSync("ok");
      if (!v || typeof v.q !== "string") {
        // 資料庫還是空的：用這台的歌單當起點
        remoteQ = null;
        push();
      } else {
        remoteQ = v.q;
        const differs = encode(state) !== encode(normalize(decode(v.q) || {}));
        if (first && legacy && differs &&
            confirm("這個連結帶著一份舊版歌單。\n要用它取代大家共用的歌單嗎？\n按「取消」會顯示目前共用的版本。")) {
          push();
        } else {
          applyRemote(v.q);
        }
      }
      if (first && location.hash) history.replaceState(null, "", location.pathname + location.search);
    }, () => setSync("off"));
  } catch (e) {
    setSync("off");
  }
}

// ---------- render ----------
function cardEl(id, listKey, index) {
  const s = song(id);
  const el = document.createElement("div");
  el.className = "card";
  el.dataset.id = id;
  el.style.setProperty("--artist", artistColor(s.artist));
  const num = listKey.startsWith("o") ? "開場" : String(index + 1);
  el.innerHTML = `
    <span class="num">${num}</span>
    <div class="meta">
      <div class="title"></div>
      <div class="artist"></div>
    </div>
    <button class="more" type="button" aria-label="移動">⋯</button>`;
  el.querySelector(".title").textContent = s.title;
  if (s.tag) {
    const t = document.createElement("span");
    t.className = "tag";
    t.textContent = s.tag;
    el.querySelector(".title").appendChild(t);
  }
  el.querySelector(".artist").textContent = s.artist || " ";
  el.querySelector(".more").addEventListener("click", e => {
    e.stopPropagation();
    openMenu(e.currentTarget, id);
  });
  return el;
}

function render() {
  for (const k of LISTS) {
    $(k).replaceChildren(...state[k].map((id, i) => cardEl(id, k, i)));
  }
  renderStatus();
}

function halfOk(n) {
  const c = state["s" + n].length;
  return state["o" + n].length === 1 && c >= SET_MIN && c <= SET_MAX;
}

function renderStatus() {
  $("count-pool").textContent = `${state.pool.length} 首未排`;
  for (const n of [1, 2]) {
    const c = state["s" + n].length;
    const el = $("count-" + n);
    el.textContent = `開場 ${state["o" + n].length}/1・曲目 ${c}/${SET_MIN}–${SET_MAX}`;
    el.className = "count " + (halfOk(n) ? "ok" : (c > SET_MAX ? "bad" : ""));
  }
  const pills = [{
    wait: `<span class="pill sync">連線中…</span>`,
    ok: `<span class="pill sync ok">已同步</span>`,
    off: `<span class="pill sync bad">離線中，連上後才會同步</span>`,
  }[syncState]];
  for (const n of [1, 2]) {
    const name = n === 1 ? "上半場" : "下半場";
    const c = state["s" + n].length;
    if (halfOk(n)) pills.push(`<span class="pill ok">${name} ✓</span>`);
    else {
      const why = [];
      if (!state["o" + n].length) why.push("缺開場");
      if (c < SET_MIN) why.push(`還差 ${SET_MIN - c} 首`);
      if (c > SET_MAX) why.push(`多了 ${c - SET_MAX} 首`);
      pills.push(`<span class="pill ${c > SET_MAX ? "bad" : ""}">${name}：${why.join("、")}</span>`);
    }
  }
  const ec = state.e.length;
  const eEl = $("count-e");
  eEl.textContent = `${ec}/${ENCORE_MIN}–${ENCORE_MAX}`;
  eEl.className = "count " + (ec >= ENCORE_MIN && ec <= ENCORE_MAX ? "ok" : (ec > ENCORE_MAX ? "bad" : ""));
  if (ec >= ENCORE_MIN && ec <= ENCORE_MAX) pills.push(`<span class="pill ok">安可 ✓</span>`);
  else if (ec > ENCORE_MAX) pills.push(`<span class="pill bad">安可：多了 ${ec - ENCORE_MAX} 首</span>`);
  else pills.push(`<span class="pill">安可：還沒排</span>`);
  const total = SET_KEYS.reduce((a, k) => a + state[k].length, 0);
  pills.push(`<span class="pill">總共 ${total} 首</span>`);
  $("status").innerHTML = pills.join("");
}

function flash(id) {
  const el = document.querySelector(`.card[data-id="${id}"]`);
  if (!el) return;
  el.scrollIntoView({ block: "center", behavior: "smooth" });
  el.classList.add("flash");
}

// ---------- drag & drop ----------
function readDom() {
  const st = { custom: state.custom, deleted: state.deleted, tags: state.tags };
  for (const k of LISTS) {
    st[k] = [...$(k).children].map(c => Number(c.dataset.id));
  }
  return st;
}

for (const k of LISTS) {
  const isOpener = k.startsWith("o");
  Sortable.create($(k), {
    group: "setlist",
    animation: 150,
    delay: 180,
    delayOnTouchOnly: true,
    filter: ".more",
    preventOnFilter: false,
    onAdd: isOpener ? evt => {
      // 開場只能一首：原本的開場曲換回新歌原本的位置
      const old = [...evt.to.children].find(c => c !== evt.item);
      if (old) evt.from.insertBefore(old, evt.from.children[evt.oldIndex] || null);
    } : undefined,
    onStart: () => { dragging = true; },
    onEnd: evt => {
      dragging = false;
      if (!pendingRemote) return update(readDom());
      // 拖曳途中別人改過歌單：把這一次移動套到最新版本上，不蓋掉別人的改動
      const st = structuredClone(pendingRemote);
      pendingRemote = null;
      const id = Number(evt.item.dataset.id), to = evt.to.id;
      if (catalog(st).some(s => s.id === id)) {
        for (const l of LISTS) st[l] = st[l].filter(x => x !== id);
        if (to.startsWith("o") && st[to].length) st.pool.push(st[to].pop());
        st[to].splice(Math.min(evt.newIndex, st[to].length), 0, id);
      }
      update(st);
    },
  });
}

// ---------- ⋯ menu (手機好用) ----------
let menuEl = null;
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }

function where(id) { return LISTS.find(k => state[k].includes(id)); }

function moveTo(id, target) {
  const from = where(id);
  const st = structuredClone(state);
  st[from] = st[from].filter(x => x !== id);
  if (target.startsWith("o") && st[target].length) {
    // 開場已有歌：換到新歌原本的地方
    const idx = state[from].indexOf(id);
    st[from].splice(idx, 0, st[target].pop());
  }
  st[target].push(id);
  update(st);
}

function openMenu(anchor, id) {
  closeMenu();
  const cur = where(id);
  menuEl = document.createElement("div");
  menuEl.className = "menu";
  const addItem = (label, fn, cls) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    if (cls) b.className = cls;
    b.addEventListener("click", () => { closeMenu(); fn(); });
    menuEl.appendChild(b);
  };
  const opts = [
    ["o1", "上半場・開場"],
    ["s1", "上半場・加到最後"],
    ["o2", "下半場・開場"],
    ["s2", "下半場・加到最後"],
    ["e", "安可・加到最後"],
    ["pool", "移回歌曲庫"],
  ].filter(([k]) => k !== cur);
  for (const [k, label] of opts) addItem(label, () => moveTo(id, k));
  menuEl.appendChild(document.createElement("hr"));
  addItem(song(id).tag ? "修改標籤…" : "加入標籤…", () => askTag(id));
  // 刪除刻意只放在歌曲庫的卡片裡，排進場次的歌要先移回歌曲庫才刪得掉
  if (cur === "pool") {
    menuEl.appendChild(document.createElement("hr"));
    addItem("刪除這首歌…", () => askDelete(id), "menu-del");
  }
  document.body.appendChild(menuEl);
  const r = anchor.getBoundingClientRect();
  const mw = menuEl.offsetWidth, mh = menuEl.offsetHeight;
  const left = Math.min(r.right - mw, window.innerWidth - mw - 8);
  let top = r.bottom + 4;
  if (top + mh > window.innerHeight - 8) top = r.top - mh - 4;
  menuEl.style.left = Math.max(8, left) + "px";
  menuEl.style.top = Math.max(8, top) + "px";
}
document.addEventListener("click", closeMenu);
window.addEventListener("scroll", closeMenu, { passive: true });

// ---------- 標籤 ----------
let pendingTag = null;

function askTag(id) {
  pendingTag = id;
  const s = song(id);
  $("tag-name").textContent = s.title;
  $("tag-input").value = s.tag || "";
  $("tag-clear").hidden = !s.tag;
  $("tag-dialog").showModal();
  $("tag-input").focus();
  $("tag-input").select();
}

function saveTag(tag) {
  $("tag-dialog").close();
  const id = pendingTag;
  if (id == null || !song(id)) return;   // 等輸入的時候被別人刪掉了
  tag = tag.trim().slice(0, TAG_MAX);
  const st = structuredClone(state);
  if (id < CUSTOM_ID_START) st.tags[id] = tag;
  else st.custom.find(c => c.id === id).tag = tag;
  update(st);
  flash(id);
}

$("tag-cancel").addEventListener("click", () => $("tag-dialog").close());
$("tag-ok").addEventListener("click", () => saveTag($("tag-input").value));
$("tag-clear").addEventListener("click", () => saveTag(""));
$("tag-input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); saveTag($("tag-input").value); }
});

// ---------- 刪除 ----------
let pendingDelete = null;

function askDelete(id) {
  pendingDelete = id;
  $("del-name").textContent = song(id).title;
  $("del-dialog").showModal();
  $("del-cancel").focus();
}

$("del-cancel").addEventListener("click", () => $("del-dialog").close());
$("del-ok").addEventListener("click", () => {
  $("del-dialog").close();
  const id = pendingDelete;
  if (id == null || where(id) !== "pool") return;   // 等確認的時候被別人移走或刪掉了
  const s = song(id);
  const st = structuredClone(state);
  st.pool = st.pool.filter(x => x !== id);
  if (id < CUSTOM_ID_START) st.deleted.push(id);
  else st.custom = st.custom.filter(c => c.id !== id);
  update(st);
  toast(`已刪除「${s.title}」`, "復原", () => {
    // 只把這首歌加回最新的歌單，不還原整份（別人這幾秒的改動要留著）
    const cur = structuredClone(state);
    if (id < CUSTOM_ID_START) cur.deleted = cur.deleted.filter(x => x !== id);
    else if (!cur.custom.some(c => c.id === id)) cur.custom.push(s);
    update(cur);
    flash(id);
  });
});

// ---------- 新增歌曲 ----------
const addDlg = $("add-dialog");
const qEl = $("add-q"), resultsEl = $("add-results");
const fTitle = $("add-title"), fArtist = $("add-artist"), fTag = $("add-tag");
let searchSeq = 0, searchTimer = null, lastResults = [];

// 比對用：忽略大小寫、空白、標點
const norm = s => (s || "").toLowerCase().normalize("NFKC").replace(/[^\p{L}\p{N}]/gu, "");

// 去掉「(Remastered 2011)」「- Live」這類版本註記
function cleanTitle(t) {
  return t
    .replace(/\s*[\(\[][^\)\]]*\b(remaster(ed)?|live|version|edit|mono|stereo|mix|demo|deluxe|bonus|acoustic|unplugged|single|feat\.?|explicit)\b[^\)\]]*[\)\]]/gi, "")
    .replace(/\s+-\s+(\d{4}\s+)?(remaster(ed)?|live|single|mono|stereo|radio edit|demo)\b.*$/i, "")
    .trim();
}
const JUNK = /karaoke|remix|8-bit|originally performed|tribute|instrumental|made famous|in the style|backing track|lullaby|music box|piano version/i;

async function search(term) {
  term = term.trim();
  const my = ++searchSeq;
  if (term.length < 2) { resultsEl.replaceChildren(); lastResults = []; return; }
  resultsEl.innerHTML = '<div class="muted">搜尋中…</div>';
  let list = [], failed = false;
  try {
    const url = "https://itunes.apple.com/search?" +
      new URLSearchParams({ term, entity: "song", limit: "25", country: "TW" });
    const data = await (await fetch(url)).json();
    const seen = new Set();
    for (const r of data.results || []) {
      if (!r.trackName || JUNK.test(r.trackName) || JUNK.test(r.artistName || "")) continue;
      const title = cleanTitle(r.trackName) || r.trackName;
      const artist = r.artistName || "";
      const key = norm(title) + "|" + norm(artist);
      if (seen.has(key)) continue;
      seen.add(key);
      list.push({ title, artist, art: r.artworkUrl60 || "" });
      if (list.length >= 6) break;
    }
  } catch (e) { failed = true; }
  if (my !== searchSeq) return;
  lastResults = list;
  showResults(term, list, failed);
}

function showResults(term, list, failed) {
  const nodes = [];
  if (failed) {
    const d = document.createElement("div");
    d.className = "muted";
    d.textContent = "搜尋服務連不上，直接在下面填歌名和歌手就好。";
    nodes.push(d);
  }
  list.forEach((r, i) => {
    const b = document.createElement("button");
    b.type = "button";
    if (r.art) {
      const img = document.createElement("img");
      img.src = r.art; img.alt = ""; img.loading = "lazy";
      b.appendChild(img);
    }
    const txt = document.createElement("div");
    txt.innerHTML = '<div class="r-title"></div><div class="r-artist"></div>';
    txt.firstChild.textContent = r.title;
    txt.lastChild.textContent = r.artist;
    b.appendChild(txt);
    b.addEventListener("click", () => pick(r, b));
    nodes.push(b);
  });
  const m = document.createElement("button");
  m.type = "button";
  m.className = "manual";
  m.textContent = list.length ? `都不是？直接用「${term}」` : `找不到，直接用「${term}」`;
  m.addEventListener("click", () => {
    pick({ title: term, artist: "" }, m);
    fArtist.focus();
  });
  nodes.push(m);
  resultsEl.replaceChildren(...nodes);
}

function pick(r, btn) {
  fTitle.value = r.title;
  fArtist.value = r.artist;
  for (const b of resultsEl.querySelectorAll("button")) b.classList.toggle("sel", b === btn);
  validateAdd();
}

// 找歌曲庫裡同名的歌（含已刪除的內建歌，用來「救回」）
function findSame(title) {
  const t = norm(title);
  const live = catalog().find(s => norm(s.title) === t);
  const deleted = BASE_SONGS.find(s => state.deleted.includes(s.id) && norm(s.title) === t);
  return { live, deleted };
}

function validateAdd() {
  const title = fTitle.value.trim();
  const { live } = findSame(title);
  $("add-msg").textContent = live
    ? `歌曲庫已經有「${live.title}」${live.artist ? `（${live.artist}）` : ""}了`
    : "";
  $("add-ok").disabled = !title || !!live;
}

function openAdd() {
  qEl.value = fTitle.value = fArtist.value = fTag.value = "";
  resultsEl.replaceChildren();
  lastResults = [];
  searchSeq++;
  validateAdd();
  addDlg.showModal();
  qEl.focus();
}

function doAdd() {
  const title = fTitle.value.trim();
  if (!title || findSame(title).live) return;
  const st = structuredClone(state);
  const { deleted } = findSame(title);
  let id;
  if (deleted) {
    id = deleted.id;
    st.deleted = st.deleted.filter(x => x !== id);
  } else {
    id = Math.max(CUSTOM_ID_START - 1, ...st.custom.map(c => c.id)) + 1;
    st.custom.push({ id, title, artist: fArtist.value.trim(), tag: fTag.value.trim() });
  }
  st.pool.push(id);
  update(st);
  addDlg.close();
  flash(id);
  toast(`已加入「${title}」`);
}

$("btn-add").addEventListener("click", openAdd);
$("add-cancel").addEventListener("click", () => addDlg.close());
$("add-ok").addEventListener("click", doAdd);
qEl.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => search(qEl.value), 350);
});
qEl.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.isComposing) return;  // 注音選字時的 Enter 不算
  e.preventDefault();
  const first = resultsEl.querySelector("button");
  if (first) first.click();
  else { clearTimeout(searchTimer); search(qEl.value); }
});
fTitle.addEventListener("input", validateAdd);
for (const f of [fTitle, fArtist, fTag]) {
  f.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.isComposing && !$("add-ok").disabled) { e.preventDefault(); doAdd(); }
  });
}

// ---------- buttons ----------
function toast(msg, actionLabel, action) {
  const t = $("toast"), act = $("toast-act");
  $("toast-msg").textContent = msg;
  act.hidden = !action;
  act.textContent = actionLabel || "";
  act.onclick = action ? () => { t.classList.remove("show"); action(); } : null;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), action ? 6000 : 2000);
}

async function copy(text, okMsg) {
  try {
    await navigator.clipboard.writeText(text);
    toast(okMsg);
  } catch (e) {
    window.prompt("複製下面這段：", text);
  }
}

function label(id) {
  const s = song(id);
  return s.title + (s.tag ? `（${s.tag}）` : "");
}

function setlistText() {
  const lines = [];
  for (const n of [1, 2]) {
    lines.push(n === 1 ? "【上半場】" : "【下半場】");
    const o = state["o" + n][0];
    lines.push("開場：" + (o ? label(o) : "（未定）"));
    state["s" + n].forEach((id, i) => lines.push(`${i + 1}. ${label(id)}`));
    lines.push("");
  }
  if (state.e.length) {
    lines.push("【安可】");
    state.e.forEach((id, i) => lines.push(`${i + 1}. ${label(id)}`));
    lines.push("");
  }
  if (state.pool.length) lines.push("未排：" + state.pool.map(label).join("、"));
  return lines.join("\n").trim();
}

$("btn-share").addEventListener("click", () => copy(location.origin + location.pathname, "網址已複製，貼到群組就好"));
$("btn-text").addEventListener("click", () => copy(setlistText(), "歌單文字已複製"));
$("btn-reset").addEventListener("click", () => {
  if (!confirm("確定把所有歌放回歌曲庫？（新增的歌會保留）")) return;
  update({ custom: state.custom, deleted: state.deleted, tags: state.tags });
});
// 頁面開著時又貼了舊版分享連結：重新載入，走一次「要不要套用」的流程
window.addEventListener("hashchange", () => { if (decode(location.hash.slice(1))) location.reload(); });

render();
startSync();
</script>
</body>
